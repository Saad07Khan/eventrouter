<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 900" width="390" height="900" role="img" aria-label="One event fans out to four destinations, three delivered and one dead">
<style>
  /* ── RETIME THE WHOLE LOOP HERE ───────────────────────────────────────── */
  svg { --loop: 10s; }

  svg {
    --bg:#F3F0EE; --card:#FBFAF9; --ink:#141413; --muted:#6B6B68;
    --line:#D8D4D0; --ok:#2F5D45; --dead:#9B3B32;
    --sans:"Inter Tight",Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --enter:cubic-bezier(.22,1,.36,1);
    --draw:cubic-bezier(.65,0,.35,1);
  }

  /* every animated element shares the same loop, so beats stay in sync */
  .a { animation-duration: var(--loop); animation-iteration-count: infinite;
       animation-fill-mode: both; transform-box: fill-box; transform-origin: center; }
  .enter { animation-timing-function: var(--enter); }
  .drawn { animation-timing-function: var(--draw); }

  .pill  { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
  .title { font-family: var(--sans); font-weight: 500; font-size: 16px; fill: var(--ink); }
  .sub   { font-family: var(--sans); font-weight: 400; font-size: 13px; fill: var(--muted); }
  .mono  { font-family: var(--mono); font-weight: 500; font-size: 16px; fill: var(--muted); }
  .edge  { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 100 100; }
  .head  { fill: var(--muted); }
  .dot   { fill: none; stroke: var(--ink); stroke-width: 7; stroke-linecap: round;
           stroke-dasharray: .01 100; }
  .bar   { fill: var(--muted); }

  /* ── BEAT 0.2s / 1.3s / 2.5s / 3.6s — nodes enter, 12px rise ──────────── */
  @keyframes rise { 0% {opacity:0; transform:translateY(12px)} 5% {opacity:1; transform:none}
                    100% {opacity:1; transform:none} }
  /* ── BEAT 1.6s / 3.2s / 5.0s — previous node recedes to 0.5 ───────────── */
  @keyframes dim  { 0% {opacity:1} 3% {opacity:.5} 100% {opacity:.5} }
  /* ── generic fade, used for sub-labels and arrowheads ─────────────────── */
  @keyframes fade { 0% {opacity:0} 3% {opacity:1} 100% {opacity:1} }
  /* ── BEAT 0.9s / 2.1s / 3.6s / 5.0s — connectors draw ─────────────────── */
  @keyframes draw { 0% {stroke-dashoffset:100} 3.5% {stroke-dashoffset:0}
                    100% {stroke-dashoffset:0} }

  /* ── BEAT 2.5s — two bars land 80ms apart, then snap into one ─────────── */
  @keyframes barL   { 0%,25% {opacity:0} 25.5% {opacity:1} 27% {opacity:1} 27.4% {opacity:0} 100% {opacity:0} }
  @keyframes barR   { 0%,25.8% {opacity:0} 26.3% {opacity:1} 27% {opacity:1} 27.4% {opacity:0} 100% {opacity:0} }
  @keyframes barOne { 0%,27% {opacity:0; transform:scaleX(.9)} 28.5% {opacity:1; transform:scaleX(1)}
                      100% {opacity:1; transform:scaleX(1)} }

  /* ── BEAT 4.2s — three rows reach the worker, one is claimed, two pass ── */
  @keyframes claimed { 0%,42% {opacity:0; transform:translateY(0)} 43% {opacity:1}
                       47% {opacity:1; transform:translateY(34px)}
                       48% {opacity:0; transform:translateY(40px)} 100% {opacity:0} }
  @keyframes passes  { 0%,42% {opacity:0; transform:translateY(0)} 43% {opacity:1}
                       52% {opacity:1; transform:translateY(120px)}
                       53.5% {opacity:0} 100% {opacity:0; transform:translateY(120px)} }

  /* ── BEAT 5.6s — a row travels the edge, ease-out on arrival ──────────── */
  @keyframes travel { 0% {opacity:0} .2% {opacity:1; stroke-dashoffset:0}
                      7% {opacity:1; stroke-dashoffset:-100}
                      7.6% {opacity:0} 100% {opacity:0; stroke-dashoffset:-100} }
  /* ── BEAT 7.1s — HubSpot's row arrives, retraces, and tries twice more ── */
  @keyframes retry  { 0% {opacity:0} .2% {opacity:1; stroke-dashoffset:0}
                      7% {stroke-dashoffset:-100} 11% {stroke-dashoffset:0}
                      15% {stroke-dashoffset:-100} 19% {stroke-dashoffset:0}
                      22% {stroke-dashoffset:-100} 23% {opacity:0}
                      100% {opacity:0; stroke-dashoffset:-100} }

  /* ── BEAT 6.3s / 6.55s / 6.8s — destination lands, 3% pulse ───────────── */
  @keyframes land     { 0% {opacity:.25; transform:scale(1)} 1.2% {opacity:1; transform:scale(1.03)}
                        3.2% {transform:scale(1)} 100% {opacity:1; transform:scale(1)} }
  @keyframes okStroke { 0% {stroke:var(--line)} 2% {stroke:var(--ok)} 100% {stroke:var(--ok)} }
  @keyframes okText   { 0% {fill:var(--muted)} 2% {fill:var(--ok)} 100% {fill:var(--ok)} }

  /* ── BEAT 7.1s — HubSpot breathes, unresolved ─────────────────────────── */
  @keyframes breathe { 0%,71% {opacity:.25} 73% {opacity:.5} 78% {opacity:.32}
                       83% {opacity:.5} 86% {opacity:.38} 88% {opacity:1} 100% {opacity:1} }
  /* ── BEAT 8.6s — third failure. Only this pill changes. ───────────────── */
  @keyframes deadStroke { 0%,86% {stroke:var(--line)} 88% {stroke:var(--dead)} 100% {stroke:var(--dead)} }
  @keyframes deadText   { 0%,86% {fill:var(--muted)} 88% {fill:var(--dead)} 100% {fill:var(--dead)} }

  /* ── BEAT 9.6s — cross-dissolve out, loop restarts on an empty card ───── */
  @keyframes loopOut { 0%,96% {opacity:1} 100% {opacity:0} }

  /* ── STATIC RESTING STATE ─────────────────────────────────────────────── */
  @media (prefers-reduced-motion: reduce) {
    .a { animation: none !important; }
    .recede { opacity: .5; }
    .edge { stroke-dashoffset: 0; }
    .dot, .barL, .barR, .row { opacity: 0; }
    .barOne, .head, .subfade { opacity: 1; }
    .dest { opacity: 1; }
    .d-ok .pill { stroke: var(--ok); } .d-ok .mono { fill: var(--ok); }
    .d-dead .pill { stroke: var(--dead); } .d-dead .mono { fill: var(--dead); }
  }
</style>

<rect width="390" height="900" fill="var(--bg)"/>
<rect x="12" y="12" width="366" height="876" rx="24" fill="var(--card)"/>

<g class="a" style="animation-name:loopOut">

  <!-- ── EDGES — straight vertical, one per gap ─────────────────────────── -->
  <path class="edge a drawn" style="animation-name:draw; animation-delay:.9s"  d="M195,206 V240" pathLength="100"/>
  <path class="edge a drawn" style="animation-name:draw; animation-delay:2.1s" d="M195,302 V336" pathLength="100"/>
  <path class="edge a drawn" style="animation-name:draw; animation-delay:3.6s" d="M195,414 V448" pathLength="100"/>
  <path class="edge a drawn" style="animation-name:draw; animation-delay:5.0s" d="M195,510 V544" pathLength="100"/>

  <path class="head a" style="animation-name:fade; animation-delay:1.21s" d="M195,242 L189,230 L201,230 Z"/>
  <path class="head a" style="animation-name:fade; animation-delay:2.41s" d="M195,338 L189,326 L201,326 Z"/>
  <path class="head a" style="animation-name:fade; animation-delay:3.91s" d="M195,450 L189,438 L201,438 Z"/>
  <path class="head a" style="animation-name:fade; animation-delay:5.45s" d="M195,546 L189,534 L201,534 Z"/>

  <!-- ── NODE 1 ─────────────────────────────────────────────────────────── -->
  <g class="recede a" style="animation-name:dim; animation-delay:1.6s">
    <g class="a enter" style="animation-name:rise; animation-delay:.2s">
      <rect class="pill" x="30" y="150" width="330" height="56" rx="28"/>
      <text class="title" x="195" y="174" text-anchor="middle">Your app</text>
      <text class="sub"   x="195" y="193" text-anchor="middle">Ada signs up</text>
    </g>
  </g>

  <!-- ── NODE 2 ─────────────────────────────────────────────────────────── -->
  <g class="recede a" style="animation-name:dim; animation-delay:3.2s">
    <g class="a enter" style="animation-name:rise; animation-delay:1.3s">
      <rect class="pill" x="30" y="246" width="330" height="56" rx="28"/>
      <text class="mono" x="195" y="272" text-anchor="middle" fill="var(--ink)">POST /v1/track</text>
    </g>
    <text class="sub subfade a" x="195" y="291" text-anchor="middle"
          style="animation-name:fade; animation-delay:1.6s">answers 202 in 40ms, Ada moves on</text>
  </g>

  <!-- ── NODE 3 ─────────────────────────────────────────────────────────── -->
  <g class="recede a" style="animation-name:dim; animation-delay:3.6s">
    <g class="a enter" style="animation-name:rise; animation-delay:2.5s">
      <rect class="pill" x="30" y="342" width="330" height="72" rx="36"/>
      <text class="title" x="195" y="366" text-anchor="middle">events + deliveries</text>
    </g>
    <text class="sub subfade a" x="195" y="384" text-anchor="middle"
          style="animation-name:fade; animation-delay:3.2s">one transaction, never half done</text>
    <rect class="bar barL a" x="140" y="396" width="50" height="4" rx="2" style="animation-name:barL"/>
    <rect class="bar barR a" x="200" y="396" width="50" height="4" rx="2" style="animation-name:barR"/>
    <rect class="bar barOne a" x="140" y="396" width="110" height="4" rx="2" style="animation-name:barOne"/>
  </g>

  <!-- ── NODE 4 — the side-note becomes this pill's sub-label ───────────── -->
  <g class="recede a" style="animation-name:dim; animation-delay:5.0s">
    <g class="a enter" style="animation-name:rise; animation-delay:3.6s">
      <rect class="pill" x="30" y="454" width="330" height="56" rx="28"/>
      <text class="title" x="195" y="478" text-anchor="middle">worker</text>
    </g>
    <text class="sub subfade a" x="195" y="497" text-anchor="middle"
          style="animation-name:fade; animation-delay:3.9s">claims rows with SKIP LOCKED</text>
  </g>

  <!-- ── SKIP LOCKED: one row claimed, two pass by unblocked ────────────── -->
  <circle class="row a" cx="165" cy="420" r="5" fill="var(--ink)" style="animation-name:passes;  animation-delay:0s"/>
  <circle class="row a" cx="195" cy="420" r="5" fill="var(--ink)" style="animation-name:claimed; animation-delay:0s"/>
  <circle class="row a" cx="225" cy="420" r="5" fill="var(--ink)" style="animation-name:passes;  animation-delay:.12s"/>

  <!-- ── DESTINATIONS — stacked, no arrows between ──────────────────────── -->
  <g class="dest d-ok a enter" style="animation-name:rise; animation-delay:.2s">
    <g class="a enter" style="animation-name:land; animation-delay:6.3s">
      <rect class="pill a" x="30" y="550" width="330" height="44" rx="22" style="animation-name:okStroke; animation-delay:6.3s"/>
      <text class="mono a" x="52" y="578" style="animation-name:okText; animation-delay:6.3s">delivered</text>
      <text class="sub" x="338" y="578" text-anchor="end">Mailchimp, 1 try</text>
    </g>
  </g>

  <g class="dest d-ok a enter" style="animation-name:rise; animation-delay:.2s">
    <g class="a enter" style="animation-name:land; animation-delay:6.55s">
      <rect class="pill a" x="30" y="608" width="330" height="44" rx="22" style="animation-name:okStroke; animation-delay:6.55s"/>
      <text class="mono a" x="52" y="636" style="animation-name:okText; animation-delay:6.55s">delivered</text>
      <text class="sub" x="338" y="636" text-anchor="end">Slack, 1 try</text>
    </g>
  </g>

  <g class="dest d-ok a enter" style="animation-name:rise; animation-delay:.2s">
    <g class="a enter" style="animation-name:land; animation-delay:6.8s">
      <rect class="pill a" x="30" y="666" width="330" height="44" rx="22" style="animation-name:okStroke; animation-delay:6.8s"/>
      <text class="mono a" x="52" y="694" style="animation-name:okText; animation-delay:6.8s">delivered</text>
      <text class="sub" x="338" y="694" text-anchor="end">Warehouse</text>
    </g>
  </g>

  <g class="dest d-dead a enter" style="animation-name:rise; animation-delay:.2s">
    <g class="a" style="animation-name:breathe">
      <rect class="pill a" x="30" y="724" width="330" height="44" rx="22" style="animation-name:deadStroke"/>
      <text class="mono a" x="52" y="752" style="animation-name:deadText">dead</text>
      <text class="sub" x="338" y="752" text-anchor="end">HubSpot, gave up</text>
    </g>
  </g>

  <!-- ── ROWS IN FLIGHT — down the worker-to-destination edge ───────────── -->
  <path class="dot a" style="animation-name:travel; animation-delay:5.60s" d="M195,510 V544" pathLength="100"/>
  <path class="dot a" style="animation-name:travel; animation-delay:5.85s" d="M195,510 V544" pathLength="100"/>
  <path class="dot a" style="animation-name:travel; animation-delay:6.10s" d="M195,510 V544" pathLength="100"/>
  <path class="dot a" style="animation-name:retry;  animation-delay:6.40s" d="M195,510 V544" pathLength="100"/>
</g>
</svg>
